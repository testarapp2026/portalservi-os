<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIDAL Partners — Serviços</title>
<style>
  :root{
    --bg:#1a1f27;          /* grafite azulado */
    --bg-2:#151a21;
    --card:#232a35;
    --card-2:#28313e;
    --border:#333d4b;
    --border-hover:#44526580;
    --blue:#5b8ac4;
    --blue-bright:#7aa6db;
    --blue-glow:rgba(91,138,196,.16);
    --gold:#c6a25f;
    --text:#eef2f7;
    --text-soft:#aab4c2;
    --text-dim:#7c8798;
    --shadow:0 1px 2px rgba(0,0,0,.30), 0 18px 40px -18px rgba(0,0,0,.65);
    --shadow-hover:0 2px 6px rgba(0,0,0,.35), 0 30px 60px -20px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1100px 520px at 50% -8%, #232c39 0%, var(--bg) 58%),
      var(--bg);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 24px;
  }

  /* ---------- Logo ---------- */
  .brand{
    margin-bottom:2px;
    text-align:center;
    width:100%;
    max-width:430px;
  }
  .logo{
    width:100%;
    max-width:430px;
    height:auto;
    display:block;
    margin:0 auto;
  }

  .subtitle{
    margin-top:14px;
    text-align:center;
  }
  .subtitle h1{
    font-size:1.22rem;
    font-weight:600;
    letter-spacing:.3px;
    color:var(--text);
  }
  .subtitle p{
    margin-top:6px;
    font-size:.9rem;
    color:var(--text-soft);
  }
  .divider{
    width:46px;height:3px;margin:11px auto 0;border-radius:2px;
    background:linear-gradient(90deg,var(--blue),var(--gold));
    opacity:.9;
  }

  /* ---------- Grid ---------- */
  .grid{
    margin-top:20px;
    width:100%;
    max-width:920px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
  }

  .card{
    position:relative;
    background:linear-gradient(160deg,var(--card-2),var(--card));
    border:1px solid var(--border);
    border-radius:15px;
    padding:24px 24px;
    text-decoration:none;
    color:inherit;
    box-shadow:var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .card::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:4px;
    background:linear-gradient(var(--blue-bright),var(--blue));
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow-hover);
    border-color:var(--border-hover);
  }
  .card:focus-visible{
    outline:2px solid var(--blue-bright);
    outline-offset:3px;
  }

  .icon{
    width:50px;
    height:50px;
    border-radius:12px;
    background:var(--blue-glow);
    border:1px solid #3a4a63;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--blue-bright);
    flex-shrink:0;
  }
  .icon svg{ width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  .card h2{
    font-size:1.12rem;
    font-weight:600;
    color:var(--text);
    letter-spacing:.2px;
  }
  .card .go{
    margin-top:auto;
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:.82rem;
    font-weight:600;
    color:var(--blue-bright);
    letter-spacing:.4px;
    text-transform:uppercase;
  }
  .card .go svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2; transition:transform .18s ease; }
  .card:hover .go svg{ transform:translateX(4px); }

  footer{
    margin-top:18px;
    font-size:.78rem;
    color:var(--text-dim);
    letter-spacing:.4px;
  }

  @media (max-width:640px){
    body{ padding:22px 14px 22px; justify-content:flex-start; }
    .brand{ max-width:220px; }
    .logo{ max-width:220px; }
    .subtitle{ margin-top:16px; }
    .subtitle h1{ font-size:1.08rem; }
    .subtitle p{ font-size:.82rem; margin-top:4px; }
    .divider{ margin-top:12px; }

    /* 2x2 compacto: 4 serviços sem scroll */
    .grid{
      margin-top:22px;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }
    .card{ padding:18px 14px; gap:11px; border-radius:14px; }
    .card::before{ width:3px; }
    .icon{ width:44px; height:44px; border-radius:11px; }
    .icon svg{ width:23px; height:23px; }
    .card h2{ font-size:1rem; line-height:1.25; }
    .card .go{ font-size:.72rem; margin-top:2px; }
  }

  /* ecrãs muito baixos: encolher ainda mais */
  @media (max-width:640px) and (max-height:680px){
    .logo{ max-width:180px; }
    .subtitle p{ display:none; }
    .divider{ display:none; }
    .grid{ margin-top:16px; gap:10px; }
    .card{ padding:15px 12px; }
  }
</style>
</head>
